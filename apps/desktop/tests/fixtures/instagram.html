<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Instagram — fixture offline</title>
<body><a href="/soulcars_teste/" aria-label="Perfil">Perfil</a><button id="criar">Criar</button><main></main>
<script>
window.posts = []; window.omitirCapa = false; window.omitirConfirmacao = false;
let files = [], cover = null;
const area = () => document.querySelector('main');
function criar() {
  files = []; cover = null;
  area().innerHTML = '<div role="dialog"><h2>Criar nova publicação</h2><input type="file" multiple accept="image/png,image/jpeg,video/mp4" style="display:none"><button>Selecionar do computador</button></div>';
  area().querySelector('button').onclick = () => area().querySelector('input').click();
  area().querySelector('input').onchange = e => {
    files = [...e.target.files].map(f => f.name);
    area().innerHTML = '<div role="dialog"><h2>Cortar</h2><button>Avançar</button></div>';
    area().querySelector('button').onclick = editar;
  };
}
function editar() {
  if (files.length > 1) return legendar();
  area().innerHTML = '<div role="dialog"><h2>' + (window.omitirCapa ? 'Editar vídeo' : 'Foto de capa') + '</h2>' + (window.omitirCapa ? '' : '<input type="file" accept="image/png,image/jpeg" style="display:none"><button id="capa">Selecionar do computador</button>') + '<button id="proximo">Avançar</button></div>';
  if (!window.omitirCapa) {
    area().querySelector('#capa').onclick = () => area().querySelector('input').click();
    area().querySelector('input').onchange = e => { cover = e.target.files[0].name; };
  }
  area().querySelector('#proximo').onclick = legendar;
}
function legendar() {
  area().innerHTML = '<div role="dialog"><h2>Nova publicação</h2>' + (files.length > 1 ? '<div contenteditable="true" role="textbox" aria-label="Escreva uma legenda" style="min-width:250px;min-height:50px"></div>' : '<textarea aria-label="Escreva uma legenda"></textarea>') + '<button>Compartilhar</button></div>';
  area().querySelector('button').onclick = () => {
    const e = area().querySelector('textarea,[contenteditable]');
    window.posts.push({ files, cover, caption: e.value ?? e.innerText });
    area().innerHTML = '<div role="dialog"><h2>' + (window.omitirConfirmacao ? 'Processando publicação' : 'Sua publicação foi compartilhada') + '</h2><button>Fechar</button></div>';
    area().querySelector('button').onclick = () => area().innerHTML = '';
  };
}
document.getElementById('criar').onclick = criar;
</script></body></html>
