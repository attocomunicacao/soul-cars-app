[project]
name = "soul-engine"
version = "0.1.0"
description = "Motor de automações do SOUL Cars (OCR, recorte, visão, vídeo e textos)"
license = "LicenseRef-Proprietary"
authors = [{ name = "Atto Comunicação" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
planilha = ["openpyxl>=3.1.5"]
documentos = ["numpy>=2.5.4", "pdfplumber>=0.11.10", "pillow>=13.0.0", "pytesseract>=0.3.13"]
recorte = ["pillow>=13.0.0", "rembg[cpu]>=2.0.86"]
video = ["faster-whisper>=1.2.1", "pillow>=13.0.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["tessdata", ".venv"]

[tool.ruff.lint]
# Conjunto mínimo (erros de sintaxe, imports e variáveis não usadas). Ampliar aos poucos.
select = ["E4", "E7", "E9", "F"]
