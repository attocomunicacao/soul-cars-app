name: Verificar SOUL Cars
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Código (lint, tipos, testes, build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm run formatar:check
      - run: npm test
      - run: npm run build
      # Só falha em vulnerabilidade alta ou crítica; os avisos moderados conhecidos
      # estão na cadeia do electron-builder (ferramenta de empacotamento).
      - run: npm audit --audit-level=high

  motor:
    name: Motor Python (testes)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      # Só os grupos que os testes usam; recorte e transcrição (modelos grandes) ficam de fora.
      - run: uv sync --group documentos
        working-directory: engine
      # O FFmpeg faz rodarem os testes da versão leve do vídeo.
      - run: choco install ffmpeg -y --no-progress
      - run: uv run --no-sync python -m unittest discover -s tests -p "test_*.py"
        working-directory: engine

  smoke:
    name: Smoke (Electron real)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: npm ci
      - run: uv sync --group documentos
        working-directory: engine
      - run: npm run build
      - run: npm run smoke
      - run: npm run smoke:instagram
