name: CI

# Verifica cada push e pull request: lint, tipos, formatação, testes, build,
# motor Python e smokes em Electron real (Windows, igual à máquina da loja).
on:
  push:
    # Branches de trabalho são verificadas pelo pull request; sem isto cada push rodava duas vezes.
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Apps (lint, tipos, testes, build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Documentação: links relativos dos .md e AGENTS.md idêntico ao CLAUDE.md.
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      # Só falha em vulnerabilidade alta ou crítica (avisos moderados conhecidos vêm do electron-builder).
      - run: npm audit --audit-level=high

  engine:
    name: Motor Python (testes)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock
      # Só os grupos que os testes usam; recorte e transcrição (modelos grandes) ficam de fora.
      - run: uv sync --group documentos --group planilha
        working-directory: apps/engine
      # Lint do motor (conjunto mínimo de regras do ruff, configurado no pyproject.toml).
      - run: uvx ruff@0.17.6 check .
        working-directory: apps/engine
      # O FFmpeg faz rodarem os testes da versão leve do vídeo.
      - run: choco install ffmpeg -y --no-progress
      - run: uv run --no-sync python -m unittest discover -s tests -p "test_*.py"
        working-directory: apps/engine

  smoke:
    name: Smoke (Electron real)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [apps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock
      - run: npm ci
      - run: uv sync --group documentos
        working-directory: apps/engine
      - run: npm run build -w apps/desktop
      - run: npm run smoke
      # Segurança, cofre, motor e gaveta (smoke:security) e páginas + acessibilidade (smoke:pages),
      # com perfil e dados temporários.
      - run: npm run smoke:security
      # Acessibilidade (axe, WCAG AA) em modo estrito, nos dois temas: qualquer violação reprova.
      - run: npm run smoke:pages
        env:
          SOUL_AXE_ESTRITO: "1"
      - run: npm run smoke:pages
        env:
          SOUL_AXE_ESTRITO: "1"
          SOUL_TEMA: dark
      # Política de segurança de conteúdo: o relatório funciona sob ela e o que é de fora é barrado.
      - run: npm run smoke:csp

  launcher-e2e:
    name: Launcher (instalação de ponta a ponta)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [apps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # O e2e instala o zip do app pelo Launcher e abre o executável instalado.
      - run: npm run package:desktop
      - run: npm run e2e:launcher
