name: Verificar SOUL Cars
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run tipos
      - run: npm test
      - run: npm run build
      - run: npm run formatar:check
