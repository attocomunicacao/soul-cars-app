name: Release

# Publica uma versão para o Soul Cars Launcher.
#   git tag v1.1.0 && git push origin v1.1.0
#
# Esta Release (repositório do código) leva SÓ o instalador do Launcher:
#   - soul-cars-launcher-setup-<versão>.exe
#
# O app vai para o repositório de atualizações (UPDATES_REPO, público), que recebe:
#   - soul-cars-desktop-<versão>-win-x64.zip   (app, baixado e instalado pelo Launcher)
#   - soul-cars-desktop-<versão>-patch.zip     (só a pasta resources: atualização sem trocar o .exe)
#   - manifest.json                             (catálogo lido pelo Launcher: versões + SHA-256)
#
# O Launcher sempre lê <UPDATES_REPO>/releases/latest/download/manifest.json, então essa
# release precisa ser pública e não marcada como pré-lançamento para chegar aos usuários.
# Exige o segredo UPDATES_REPO_TOKEN (token com escrita em "Contents" do repositório de
# atualizações): o GITHUB_TOKEN deste repositório não alcança outro repositório.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.1.0) para um build de teste, sem publicar"
        required: true

permissions:
  contents: write

env:
  # Repositório público que hospeda app, patch e manifest.json (mantenha igual a
  # REPOSITORIO_ATUALIZACOES em apps/launcher/src/main/config.ts).
  UPDATES_REPO: attocomunicacao/soul-cars-updates

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Definir versão
        id: versao
        shell: bash
        env:
          # Entrada do usuário: vai por variável de ambiente, nunca interpolada no script.
          VERSAO_INFORMADA: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="$VERSAO_INFORMADA"; fi
          # Só x.y.z (com sufixo opcional): impede que um nome de tag ou entrada vire comando nos passos seguintes.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versão inválida: '$V'. Use o formato x.y.z."
            exit 1
          fi
          echo "valor=$V" >> "$GITHUB_OUTPUT"

      - run: npm ci
      # O app leva a versão da tag. O Launcher tem versão própria (apps/launcher/package.json):
      # só muda quando o Launcher muda. Assim as releases comuns não oferecem instalador novo do
      # Launcher (um .exe novo, que o Windows precisaria conhecer de novo antes de abrir).
      - name: Aplicar a versão ao app
        run: npm version ${{ steps.versao.outputs.valor }} --no-git-tag-version --allow-same-version -w apps/desktop

      # O instalador do Launcher é sempre empacotado (a Release deste repositório o leva).
      # O manifest.json só oferece instalador novo quando a versão do Launcher mudou.
      - name: Ler a versão do Launcher e o manifesto anterior
        id: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN || github.token }}
        run: |
          LV=$(node -p "require('./apps/launcher/package.json').version")
          echo "versao=$LV" >> "$GITHUB_OUTPUT"
          PREV=""
          if gh release download --repo "$UPDATES_REPO" --pattern manifest.json --output manifest-anterior.json --clobber 2>/dev/null; then
            PREV=$(node -p "require('./manifest-anterior.json').launcher.version")
            echo "anterior=manifest-anterior.json" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PREV" = "$LV" ]; then echo "novo=nao" >> "$GITHUB_OUTPUT"; else echo "novo=sim" >> "$GITHUB_OUTPUT"; fi
          echo "Launcher $LV (no manifesto anterior: ${PREV:-nenhum})"

      # Mesmas verificações do CI: uma tag nunca publica código que o CI reprovaria.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/engine/uv.lock
      - run: uv sync --group documentos --group planilha
        working-directory: apps/engine
      - run: choco install ffmpeg -y --no-progress
      - name: Testes do motor Python
        run: uv run --no-sync python -m unittest discover -s tests -p "test_*.py"
        working-directory: apps/engine
      - run: npm run package:desktop
      # Instala o pacote recém-gerado pelo Launcher e abre o app (o mesmo caminho do usuário).
      - run: npm run e2e:launcher
      - name: Pacote só de código do app
        id: patch
        shell: bash
        run: |
          V="${{ steps.versao.outputs.valor }}"
          OUT=$(node scripts/release/create-patch.mjs --unpacked apps/desktop/dist/win-unpacked --out "apps/desktop/dist/soul-cars-desktop-$V-patch.zip")
          echo "$OUT"
          echo "runtime=$(echo "$OUT" | grep '^runtime=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Empacotar o Launcher
        run: npm run package:launcher

      - name: Notas da versão
        shell: bash
        run: |
          # Trecho do CHANGELOG.md desta versão (entre "## [x.y.z]" e o próximo "## [").
          # Aceita também "## \[x.y.z\]" (alguns editores escapam os colchetes ao salvar).
          awk -v v="${{ steps.versao.outputs.valor }}" '
            { n = split($0, p, sprintf("%c", 92)); l = ""; for (i = 1; i <= n; i++) l = l p[i] }
            substr(l, 1, 4) == "## [" { if (on) exit; if (index(l, "## [" v "]") == 1) { on = 1; next } }
            on { print }' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::CHANGELOG.md não tem a seção ## [${{ steps.versao.outputs.valor }}]. Acrescente-a e publique a tag de novo."
              exit 1
            fi
            echo "::warning::CHANGELOG.md não tem a seção ## [${{ steps.versao.outputs.valor }}]; notas padrão usadas (build de teste)."
            echo "Soul Cars ${{ steps.versao.outputs.valor }}." > release-notes.md
          fi

      - name: Gerar manifest.json
        shell: bash
        run: |
          V="${{ steps.versao.outputs.valor }}"
          LV="${{ steps.launcher.outputs.versao }}"
          ARGS=(--version "$V"
            --app-zip "apps/desktop/dist/soul-cars-desktop-$V-win-x64.zip"
            --patch-zip "apps/desktop/dist/soul-cars-desktop-$V-patch.zip"
            --runtime "${{ steps.patch.outputs.runtime }}"
            --launcher-version "$LV"
            --base-url "https://github.com/${UPDATES_REPO}/releases/download/v$V/"
            --launcher-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/"
            --notes release-notes.md
            --out manifest.json)
          if [ "${{ steps.launcher.outputs.novo }}" = "sim" ]; then
            ARGS+=(--launcher-exe "apps/launcher/dist/soul-cars-launcher-setup-$LV.exe")
          else
            ARGS+=(--previous-manifest "${{ steps.launcher.outputs.anterior }}")
          fi
          node scripts/release/create-manifest.mjs "${ARGS[@]}"

      - name: Publicar o app no repositório de atualizações
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta o segredo UPDATES_REPO_TOKEN (escrita em $UPDATES_REPO)."
            exit 1
          fi
          V="${{ steps.versao.outputs.valor }}"
          gh release create "v$V" \
            "apps/desktop/dist/soul-cars-desktop-$V-win-x64.zip" \
            "apps/desktop/dist/soul-cars-desktop-$V-patch.zip" \
            manifest.json \
            --repo "$UPDATES_REPO" --title "Soul Cars v$V" --notes-file release-notes.md

      # Por último: o Launcher só vê a versão nova quando o app já está publicado.
      - name: Publicar o Launcher nesta Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.versao.outputs.valor }}"
          LV="${{ steps.launcher.outputs.versao }}"
          # Cópia com nome fixo: o site baixa direto de .../releases/latest/download/soul-cars-launcher-setup.exe
          cp "apps/launcher/dist/soul-cars-launcher-setup-$LV.exe" apps/launcher/dist/soul-cars-launcher-setup.exe
          gh release create "v$V" \
            "apps/launcher/dist/soul-cars-launcher-setup-$LV.exe" \
            apps/launcher/dist/soul-cars-launcher-setup.exe \
            --title "Soul Cars v$V" --notes-file release-notes.md

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: soul-cars-${{ steps.versao.outputs.valor }}
          path: |
            apps/desktop/dist/*.zip
            apps/launcher/dist/*.exe
            manifest.json
