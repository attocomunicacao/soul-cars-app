name: Release

# Publica uma versão para o Soul Cars Launcher.
#   git tag v1.1.0 && git push origin v1.1.0
#
# Gera e anexa à GitHub Release:
#   - soul-cars-desktop-<versão>-win-x64.zip   (app, baixado e instalado pelo Launcher)
#   - soul-cars-launcher-setup-<versão>.exe    (instalador do Launcher, para a equipe)
#   - manifest.json                             (catálogo lido pelo Launcher: versões + SHA-256)
#
# O Launcher sempre lê .../releases/latest/download/manifest.json, então a release
# precisa ser pública e não marcada como pré-lançamento para chegar aos usuários.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.1.0) para um build de teste, sem publicar"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Definir versão
        id: versao
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version }}"; fi
          echo "valor=$V" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Aplicar a versão aos apps
        run: |
          npm version ${{ steps.versao.outputs.valor }} --no-git-tag-version --allow-same-version -w apps/desktop
          npm version ${{ steps.versao.outputs.valor }} --no-git-tag-version --allow-same-version -w apps/launcher

      - run: npm run typecheck
      - run: npm test
      - run: npm run package:desktop
      - run: npm run package:launcher

      # Pacote MSIX para a Microsoft Store (a Microsoft assina na publicação, de graça).
      # A identidade vem do Partner Center: Produto › Gerenciamento de produto › Identidade do
      # produto. Cadastre em Settings › Secrets and variables › Actions › Variables:
      #   STORE_IDENTITY_NAME (Package/Identity/Name), STORE_PUBLISHER (Package/Identity/Publisher)
      #   e STORE_PUBLISHER_DISPLAY_NAME (Package/Properties/PublisherDisplayName).
      - name: Pacote da Microsoft Store (MSIX)
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          ARGS=()
          [ -n "$STORE_IDENTITY_NAME" ] && ARGS+=("-c.appx.identityName=$STORE_IDENTITY_NAME")
          [ -n "$STORE_PUBLISHER" ] && ARGS+=("-c.appx.publisher=$STORE_PUBLISHER")
          [ -n "$STORE_PUBLISHER_DISPLAY_NAME" ] && ARGS+=("-c.appx.publisherDisplayName=$STORE_PUBLISHER_DISPLAY_NAME")
          if [ -z "$STORE_PUBLISHER" ]; then
            echo "::warning::Variáveis STORE_* não cadastradas: o MSIX sai com identidade provisória e não pode ser enviado à Store."
          fi
          cd apps/desktop
          npx electron-builder --win appx --x64 --publish never "${ARGS[@]}"

      - name: Guardar o MSIX para enviar à Store
        uses: actions/upload-artifact@v4
        with:
          name: soul-cars-store-${{ steps.versao.outputs.valor }}
          path: apps/desktop/dist/*.appx
          if-no-files-found: error
          retention-days: 90

      - name: Notas da versão
        shell: bash
        run: |
          # Trecho do CHANGELOG.md desta versão (entre "## [x.y.z]" e o próximo "## [").
          # Aceita também "## \[x.y.z\]" (alguns editores escapam os colchetes ao salvar).
          awk -v v="${{ steps.versao.outputs.valor }}" '
            { n = split($0, p, sprintf("%c", 92)); l = ""; for (i = 1; i <= n; i++) l = l p[i] }
            substr(l, 1, 4) == "## [" { if (on) exit; if (index(l, "## [" v "]") == 1) { on = 1; next } }
            on { print }' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::CHANGELOG.md não tem a seção ## [${{ steps.versao.outputs.valor }}]; notas padrão usadas."
            echo "Soul Cars ${{ steps.versao.outputs.valor }}." > release-notes.md
          fi

      - name: Gerar manifest.json
        shell: bash
        run: |
          V="${{ steps.versao.outputs.valor }}"
          node scripts/release/create-manifest.mjs \
            --version "$V" \
            --app-zip "apps/desktop/dist/soul-cars-desktop-$V-win-x64.zip" \
            --launcher-exe "apps/launcher/dist/soul-cars-launcher-setup-$V.exe" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V/" \
            --notes release-notes.md \
            --out manifest.json

      - name: Publicar a Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.versao.outputs.valor }}"
          gh release create "v$V" \
            "apps/desktop/dist/soul-cars-desktop-$V-win-x64.zip" \
            "apps/launcher/dist/soul-cars-launcher-setup-$V.exe" \
            manifest.json \
            --title "Soul Cars v$V" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: soul-cars-${{ steps.versao.outputs.valor }}
          path: |
            apps/desktop/dist/*.zip
            apps/launcher/dist/*.exe
            manifest.json
