name: Publicar instalador

# Cria o instalador do Windows e anexa a uma Release do GitHub.
# Para publicar uma versão:  git tag v1.0.0  e  git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run empacotar
      - name: Criar Release com o instalador
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/SOUL-Cars-Setup-*.exe \
            --title "SOUL Cars ${GITHUB_REF_NAME}" --generate-notes
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: instalador
          path: dist/SOUL-Cars-Setup-*.exe
